name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal tests)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: make build
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.4
      - run: make integration
      - run: make demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-audit-reports
          path: demo/*report.json
          if-no-files-found: ignore
